name: Sincronização Develop → Staging

on:
  schedule:
    # 🕒 Executa automaticamente todos os dias às 03:00 UTC (00:00 no horário de Brasília)
    - cron: "0 3 * * *"

  workflow_dispatch: # Permite rodar manualmente pelo GitHub Actions

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # precisa do histórico completo para o merge

      - name: Configurar Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Sincronizar develop → staging
        run: |
          git fetch origin
          git checkout staging

          # 🔁 Faz o merge das atualizações da develop para a staging
          git merge origin/develop --no-edit || true

          # 🧠 Verifica se houve alterações após o merge
          if ! git diff --quiet; then
            echo "Sincronização automática da branch develop → staging realizada em $(date '+%d/%m/%Y %H:%M:%S')" > sync-log.txt
            git add sync-log.txt
            git commit -m "chore(ci): sincronização automática develop → staging ($(date '+%d/%m/%Y %H:%M:%S'))"
            echo "✅ Alterações encontradas. Commit de sincronização criado com sucesso."
          else
            echo "ℹ️ Nenhuma atualização necessária. A branch staging já está sincronizada com a develop."
          fi

          # 🚀 Envia o resultado para o repositório remoto
          git push origin staging
