name: Cypress Tests (Multi-Browser + Cloud)

on:
    push:
        branches:
            - test/criação-pipeline-cypress
  #workflow_run:
    #workflows: ["CI (PR - Frontend)"]
    #types:
      #- completed
    workflow_dispatch: # permite rodar manualmente pelo GitHub
     inputs:
      browsers:
        description: "Escolher navegadores (chrome, edge, firefox, electron)"
        required: false
        default: "chrome,edge,firefox,electron"

jobs:
  cypress-run:
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge, firefox, electron]  # 🧠 define os navegadores

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci


      # 🚀 Inicia o servidor Angular na porta 4201
      - name: Start server
        run: |
          npm start -- --port=4201 &
          npx wait-on http://localhost:4201

      # 🧪 Executa os testes Cypress no navegador especificado
      - name: Run Cypress tests (${{ matrix.browser }})
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          record: true                      # ✅ envia os resultados ao Cypress Cloud
          parallel: true                    # 🚀 executa em paralelo no Cloud
          group: "Tests - ${{ matrix.browser }}" # agrupa por navegador
          wait-on: "http://localhost:4201"
          wait-on-timeout: 120
          command: npx cypress run --browser ${{ matrix.browser }} --record --parallel
        env:
          CYPRESS_BASE_URL: "http://localhost:4201"
          CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
      

      # 💾 Upload de screenshots e vídeos (se falhar)
      - name: Upload Cypress artifacts (${{ matrix.browser }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ matrix.browser }}
          path: |
            cypress/screenshots
            cypress/videos
