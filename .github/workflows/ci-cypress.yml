name: Cypress Tests (Chrome + Cloud)

on:
    pull_request:
        branches:
            - staging
        paths:
            - 'cypress/**'
            - 'package.json'
            - 'package-lock.json'
    workflow_dispatch: # permite rodar manualmente pelo GitHub
        inputs:
            browsers:
                description: "Escolher navegadores (chrome, edge, firefox, electron)"
                required: false
                default: "chrome"

jobs:
    cypress-run:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                browser: [chrome] #  define os navegadores

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node 20
              uses: actions/setup-node@v4
              with:
                  node-version: 20
            # Cache otimizado do npm
            - name: Cache Node modules
              uses: actions/cache@v3
              with:
                  path: ~/.npm
                  key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                    ${{ runner.os }}-node-

            # Cache do Cypress binário
            - name: Cache Cypress binary
              uses: actions/cache@v3
              with:
                 path: ~/.cache/Cypress
                 key: cypress-binary-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              run: npm ci


            #  Executa os testes Cypress no navegador especificado
            - name: Run Cypress tests (${{ matrix.browser }})
              uses: cypress-io/github-action@v6
              with:
                  browser: ${{ matrix.browser }}
                  record: true
                  parallel: false
                  group: "Tests - ${{ matrix.browser }}"
                  wait-on-timeout: 120
              env:
                  CYPRESS_PROJECT_ID: ${{ secrets.CYPRESS_PROJECT_ID }}
                  CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}

        #   #  Upload de screenshots e vídeos (se falhar)
