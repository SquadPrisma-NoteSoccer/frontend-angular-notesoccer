# netlify.toml

[build]
# Build padrão (local/preview) SEM prerender/SSR
command = "npm ci && npx ng build --configuration=development --output-path=dist/notesoccer --no-prerender"
publish = "dist/notesoccer/browser"

[build.environment]
NODE_VERSION = "20"

# Produção (main) — build normal (mantém possibilidade de SSR/prerender)
[context.production]
command = "npm ci && npx ng build --configuration=production --output-path=dist/notesoccer"

# Branch deploys (ex.: develop) — SEM prerender
[context.branch-deploy]
command = "npm ci && npx ng build --configuration=development --output-path=dist/notesoccer --no-prerender"

# Deploy previews (PRs) — SEM prerender
[context.deploy-preview]
command = "npm ci && npx ng build --configuration=development --output-path=dist/notesoccer --no-prerender"

# SPA fallback para rotas do Angular
[[redirects]]
from = "/*"
to = "/index.html"
status = 200


