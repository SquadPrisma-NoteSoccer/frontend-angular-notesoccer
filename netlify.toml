[build]
command = "bash ./netlify-build.sh development"
publish = "dist/publish"

[build.environment]
NODE_VERSION = "20"

[context.production]
command = "bash ./netlify-build.sh production"
publish = "dist/publish"

[context.branch-deploy]
command = "bash ./netlify-build.sh development"
publish = "dist/publish"

[context.deploy-preview]
command = "bash ./netlify-build.sh development"
publish = "dist/publish"

[context."branch:staging"]
command = "bash ./netlify-build.sh development"
publish = "dist/publish"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
