[build]
command = "npm install && npm run build -- --configuration=development"
publish = "dist/notesoccer/browser"

[build.environment]
NODE_VERSION = "20"

# Produção (main)
[context.production]
command = "npm ci && npm run build -- --configuration=production"

# Branch deploys (develop, etc.)
[context.branch-deploy]
command = "npm install && npm run build -- --configuration=development"

# Deploy previews (PRs)
[context.deploy-preview]
command = "npm ci && npm run build -- --configuration=development"

# Angular SPA
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
