[build]
  command = "npm install && npm run build -- --configuration=production"
  publish = "dist/notesoccer/browser"

[build.environment]
  NODE_VERSION = "20"

# Produção (branch main)
[context.production]
  command = "npm install && npm run build -- --configuration=production"

# Branch deploys (ex.: develop)
[context.branch-deploy]
  command = "npm install && npm run build -- --configuration=development"

# Deploy previews (PRs)
[context.deploy-preview]
  command = "npm install && npm run build -- --configuration=development"

# Angular SPA redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
