[build]
# Build sem prerender; se gerar "browser/", copiamos pro root e publicamos o root.
command = "npm ci && npx ng build --configuration=development --output-path=dist/notesoccer --no-prerender && if [ -d dist/notesoccer/browser ]; then cp -r dist/notesoccer/browser/* dist/notesoccer/; fi && echo '--- ls dist/notesoccer (publicado)' && ls -la dist/notesoccer"
publish = "dist/notesoccer"

[build.environment]
NODE_VERSION = "20"

[context.production]
command = "npm ci && npx ng build --configuration=production --output-path=dist/notesoccer && if [ -d dist/notesoccer/browser ]; then cp -r dist/notesoccer/browser/* dist/notesoccer/; fi && echo '--- ls dist/notesoccer (publicado)' && ls -la dist/notesoccer"
publish = "dist/notesoccer"

[context.branch-deploy]
command = "npm ci && npx ng build --configuration=development --output-path=dist/notesoccer --no-prerender && if [ -d dist/notesoccer/browser ]; then cp -r dist/notesoccer/browser/* dist/notesoccer/; fi && echo '--- ls dist/notesoccer (publicado)' && ls -la dist/notesoccer"
publish = "dist/notesoccer"

[context.deploy-preview]
command = "npm ci && npx ng build --configuration=development --output-path=dist/notesoccer --no-prerender && if [ -d dist/notesoccer/browser ]; then cp -r dist/notesoccer/browser/* dist/notesoccer/; fi && echo '--- ls dist/notesoccer (publicado)' && ls -la dist/notesoccer"
publish = "dist/notesoccer"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
